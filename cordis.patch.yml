# ============================================================================
# lawcase —— 律案编排与验收助手 bundle patch
# ============================================================================
# 安装（本地 link）：
#   <Harness>/Contents/Resources/runtime/cli/bin/dsh plugin --profile desktop add link:<本目录绝对路径>
#
# 本文件随工作区同步到每一台电脑，所以这里**不写任何一台机器的绝对路径**。
# 案件目录一律由工具调用的 case 参数显式给出（绝对路径），插件不猜 cwd。
# ============================================================================

- insert:
    - id: lawcase
      name: lawcase
      config:
        # 案件数据根目录。auto = 留空，完全依赖每次工具调用的 case 参数（推荐）。
        # 需要固定时写本机绝对路径，或用环境变量 LAWCASE_ROOT 覆盖（优先级最高）。
        root: auto

        # 只读案卷白名单（可选）：写在这里的目录，插件只读不写，
        # 所有产出强制落到工作区。留空 = 不做额外限制（仅靠 OS 权限）。
        readonlyRoots: []

        # 单次扫描的最大文件数，防止误扫巨型目录把会话拖死
        scanLimit: 2000

        # 单个文件超过此体积（MB）时只登记不解析，交人工判断
        parseMaxMB: 200
